name: agrinexa
description: "AgriNexa - The world's best agricultural marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:       # ← Added for language support
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^0.8.9
  intl: ^0.20.2
  http: ^1.6.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_core: ^4.5.0
  google_sign_in: ^5.4.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  firebase_messaging: ^16.1.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true               # ← Added to auto-generate localization code
  uses-material-design: true

  assets:

    - assets/images/logo.png
    - assets/images/google.png